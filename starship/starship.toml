# One-line, plain-text prompt. No Nerd Font needed.
#   ~/code/api main !? go v1.23.2 3s $
add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$c\
$golang\
$lua\
$nodejs\
$python\
$rust\
$cmd_duration\
$character"""

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " ro"

[git_branch]
style = "purple"
format = "[$branch]($style) "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style) )"

[c]
symbol = "c "
format = "[$symbol($version )]($style)"

[golang]
symbol = "go "
format = "[$symbol($version )]($style)"

[lua]
symbol = "lua "
format = "[$symbol($version )]($style)"

[nodejs]
symbol = "node "
format = "[$symbol($version )]($style)"

[python]
symbol = "py "
format = "[$symbol($version )(\\($virtualenv\\) )]($style)"

[rust]
symbol = "rs "
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[$duration]($style) "

[character]
success_symbol = "[\\$](bold green)"
error_symbol = "[\\$](bold red)"
