# reload config
bind R source-file ~/.config/tmux/tmux.conf \; display '~/.config/tmux/tmux.conf reloaded'

# Toggle mouse mode
bind M set -g mouse

# tmux-sensible selects
set -sg escape-time 10
set -g history-limit 50000
set -g focus-events on
set -g display-time 2000

# Enable VI keybindings when in copy-mode
setw -g mode-keys vi

# Change copy-mode yank to be like VIM
unbind -T copy-mode-vi Space
bind -T copy-mode-vi v send-keys -X begin-selection
unbind -T copy-mode-vi Enter

# start window numbering at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# set terminal title
set -g set-titles on

# don't rename windows automatically
set-option -g allow-rename off

# configure the terminal colors according to the OS
if-shell '[ "$(uname -s)" = Darwin ]' {
  # MACOS
  set-option -g default-terminal "screen-256color"
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
} {
  # LINUX
  set-option -ga terminal-overrides ',*:Tc'
  # Wayland sessions use wl-copy; X11 uses xclip
  if-shell '[ -n "$WAYLAND_DISPLAY" ]' {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
  } {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
  }
}

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Colors: match Neovim's default colorscheme (dark variant)
# NvimDarkGrey2 #14161b  NvimDarkGrey3 #2c2e33  NvimDarkGrey4 #4f5258
# NvimLightGrey2 #e0e2ea NvimLightGrey3 #c4c6cd NvimLightGrey4 #9b9ea4
# NvimDarkYellow #6b5300 NvimLightYellow #fce094 NvimLightGreen #b3f6c0
# Accents: NvimLightBlue #a6dbff NvimLightCyan #8cf8f7 NvimLightGreen #b3f6c0
#          NvimLightMagenta #ffcaff NvimLightRed #ffc0b9 NvimLightYellow #fce094
%hidden ACCENT='#a6dbff'

# status bar like TabLine/TabLineFill, current window like StatusLine
set -g status-style 'bg=#2c2e33,fg=#c4c6cd'
set -g window-status-style 'bg=#2c2e33,fg=#9b9ea4'
set -g window-status-current-style "bg=$ACCENT,fg=#07080d,bold"
set -g window-status-activity-style 'bg=#2c2e33,fg=#fce094'
set -g window-status-bell-style 'bg=#2c2e33,fg=#fce094,bold'
set -g window-status-format ' #I:#W#F '
set -g window-status-current-format ' #I:#W '
set -g window-status-separator ''
set -g status-left-style "bg=#4f5258,fg=$ACCENT,bold"
set -g status-left ' #S '
set -g status-right ' %Y-%m-%d %H:%M '

# pane borders like WinSeparator
set -g pane-border-style 'fg=#4f5258'
set -g pane-active-border-style "fg=$ACCENT"

# messages/command prompt like Normal + ModeMsg
set -g message-style 'bg=#14161b,fg=#b3f6c0'
set -g message-command-style 'bg=#14161b,fg=#e0e2ea'

# copy mode: selection like Visual, matches like Search/CurSearch
set -g mode-style 'bg=#4f5258,fg=#e0e2ea'
set -g copy-mode-match-style 'bg=#6b5300,fg=#eef1f8'
set -g copy-mode-current-match-style 'bg=#fce094,fg=#07080d'

